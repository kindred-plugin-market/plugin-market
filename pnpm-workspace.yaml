# pnpm 12 在依赖构建脚本未被批准/拒绝时会直接让 install 失败（ERR_PNPM_IGNORED_BUILDS）。
# lefthook 的 postinstall 会覆写 .husky，因此显式拒绝（与宿主 bench-quality-cli 生成策略一致）。
allowBuilds:
  lefthook: false
minimumReleaseAgeExclude:
  - lefthook-darwin-arm64@2.1.14
  - lefthook-darwin-x64@2.1.14
  - lefthook-freebsd-arm64@2.1.14
  - lefthook-freebsd-x64@2.1.14
  - lefthook-linux-arm64@2.1.14
  - lefthook-linux-x64@2.1.14
  - lefthook-openbsd-arm64@2.1.14
  - lefthook-openbsd-x64@2.1.14
  - lefthook-windows-arm64@2.1.14
  - lefthook-windows-x64@2.1.14
  - lefthook@2.1.14
