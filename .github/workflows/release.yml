name: Release

# push <pluginId>-v<version> tag（如 photo-triage-v1.0.0）→ 借 Bench 宿主工作区
# 构建该插件 → 注入 files 清单 → 打 zip → 发布 GitHub Release。
# zip = 部署形态（manifest.json + index.html + bundle/），插件市场
# registry.json 的 downloadUrl 指向本 Release 资产。
# 注意：push 到 main 分支的常规构建在 build.yml；本工作流不监听分支。
#
# P09：与 build.yml/quality.yml 共用同一组输入（`.github/host-baseline.txt` 宿主 SHA、
# `.node-version` Node 26.8.2、PNPM_VERSION 12.4.1、Action 完整 SHA），并发布
# `provenance.json` 来源收据。
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "Plugin id to release"
        required: true
        default: "hardware"

permissions:
  contents: read

concurrency:
  group: plugin-publish
  cancel-in-progress: false

env:
  PNPM_VERSION: 12.4.1

jobs:
  baseline:
    name: resolve host baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.host.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned host sha
        id: host
        run: echo "sha=$(cat .github/host-baseline.txt)" >> "$GITHUB_OUTPUT"

  # P10：正式发布同样先过门禁（tag ref 上跑，被验证的就是这个 tag 指向的 SHA）。
  gate:
    needs: baseline
    uses: ./.github/workflows/quality-gate.yml
    with:
      host-ref: ${{ needs.baseline.outputs.sha }}

  build:
    needs: [baseline, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - name: Resolve plugin id
        run: |
          if [ -n "${{ github.event.inputs.plugin_id }}" ]; then
            echo "PLUGIN_ID=${{ github.event.inputs.plugin_id }}" >> "$GITHUB_ENV"
          else
            echo "PLUGIN_ID=${GITHUB_REF_NAME%-v*}" >> "$GITHUB_ENV"
          fi

      - name: Checkout plugin-market repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: market

      - name: Checkout Bench host workspace
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: indredK/bench
          ref: ${{ needs.baseline.outputs.sha }}
          token: ${{ secrets.BENCH_REPO_TOKEN }}
          path: bench

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: market/.node-version
          cache: pnpm
          cache-dependency-path: |
            market/pnpm-lock.yaml
            bench/pnpm-lock.yaml

      - name: Install host dependencies
        working-directory: bench
        run: pnpm install --frozen-lockfile

      - name: Install market dependencies
        working-directory: market
        run: pnpm install --frozen-lockfile

      - name: Verify plugin exists
        run: test -f "market/extensions/$PLUGIN_ID/manifest.json"

      - name: Place plugin into host workspace
        run: |
          mkdir -p bench/extensions
          rm -rf "bench/extensions/$PLUGIN_ID"
          cp -R "market/extensions/$PLUGIN_ID" "bench/extensions/$PLUGIN_ID"

      - name: Audit i18n self-containment
        run: node market/scripts/audit-i18n.mjs --bench bench --plugin "$PLUGIN_ID"

      - name: Build & pack extension
        working-directory: bench
        run: node scripts/plugins/pack-extension.mjs "$PLUGIN_ID" --out "$GITHUB_WORKSPACE/dist"

      - name: Write provenance receipt
        env:
          HOST_SHA: ${{ needs.baseline.outputs.sha }}
          MARKET_SHA: ${{ github.sha }}
        run: |
          node market/scripts/write-provenance.mjs \
            --dist "$GITHUB_WORKSPACE/dist" \
            --market-sha "$MARKET_SHA" \
            --host-sha "$HOST_SHA" \
            --host-dir bench

      # release-please（release-please.yml）已创建带 changelog body 的 Release；
      # 此处仅追加 zip 资产。不开启 generate_release_notes，避免覆盖其 body。
      #
      # ⚠️ 不用 softprops/action-gh-release：Release 已存在时它走 PATCH
      # update-a-release，本仓库 GITHUB_TOKEN 无该权限（403 Resource not
      # accessible by integration）。改用 gh release upload（只传资产）。
      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # 仓库 checkout 在 market/ 子目录，$GITHUB_WORKSPACE 不是 git 仓库，
          # gh 必须用 --repo 显式指定（否则报 "not a git repository"）。
          repo="${GITHUB_REPOSITORY}"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$repo" --title "${PLUGIN_ID} ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/provenance.json --repo "$repo" --clobber

      # workflow_dispatch（诊断用）在分支 ref 上运行，无法创建 Release，
      # 以 artifact 形式保留 zip 与来源收据以便下载验证。
      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-ext-${{ env.PLUGIN_ID }}-zip
          path: |
            dist/*.zip
            dist/provenance.json
          retention-days: 14
          if-no-files-found: error

      # 市场索引自持（P5）：zip 上传后把该版本 upsert 进 registry.json 并推回 main。
      # Bench 每次打开市场都实时拉 registry.json → 推完即在插件中心可见，
      # 无需改 Bench、无需手工维护 registry、无需发版宿主。
      - name: Update market registry
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*-v}"
          echo "Updating registry: ${PLUGIN_ID}@${version}"
          cd market
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 从 main 最新状态开工（tag 可能落后于 main，避免把 main 推回旧提交）。
          git fetch origin main --depth=1
          git checkout -B main origin/main
          node scripts/update-registry.mjs \
            --plugin "$PLUGIN_ID" \
            --version "$version" \
            --dist "$GITHUB_WORKSPACE/dist"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged"
            exit 0
          fi
          git commit -m "chore(registry): publish ${PLUGIN_ID} v${version}"
          git pull --rebase origin main
          git push origin main
