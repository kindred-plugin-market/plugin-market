name: Release

# push <pluginId>-v<version> tag（如 photo-triage-v1.0.0）→ 借 Bench 宿主工作区
# 构建该插件 → 注入 files 清单 → 打 zip → 发布 GitHub Release。
# zip = 部署形态（manifest.json + index.html + bundle/），插件市场
# registry.json 的 downloadUrl 指向本 Release 资产。
# 注意：push 到 main 分支的常规构建在 build.yml；本工作流不监听分支。
#
# P09：与 build.yml/quality.yml 共用同一组输入（`.github/host-baseline.txt` 宿主 SHA、
# `.node-version` Node 26.8.2、PNPM_VERSION 12.4.2、Action 完整 SHA），并发布
# `provenance.json` 来源收据。
on:
  push:
    tags:
      - "*-v*"
  workflow_dispatch:
    inputs:
      plugin_id:
        description: "Plugin id to release"
        required: true
        default: "hardware"

permissions:
  contents: read

concurrency:
  # 正式 release 按 tag 排队（不同 tag 的资产互不同名，并行安全）；
  # 不能与滚动 build 共用全局组 —— 7 个 tag 同时 dispatch 时会互相取消。
  group: plugin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: 12.4.2

jobs:
  baseline:
    name: resolve host baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.host.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned host sha
        id: host
        run: echo "sha=$(cat .github/host-baseline.txt)" >> "$GITHUB_OUTPUT"

  # P10：正式发布同样先过门禁（tag ref 上跑，被验证的就是这个 tag 指向的 SHA）。
  gate:
    needs: baseline
    uses: ./.github/workflows/quality-gate.yml
    with:
      host-ref: ${{ needs.baseline.outputs.sha }}

  build:
    needs: [baseline, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      # P11：registry 写回走 bot 分支 + PR —— gh pr create 需要 PR 写权限。
      pull-requests: write
    steps:
      - name: Checkout plugin-market repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: market

      - name: Checkout Bench host workspace
        # P12: indredK/bench 是 public 仓库 —— 匿名 checkout 即可，不携带 PAT，
        # 并显式 persist-credentials: false 防止凭据落入 checkout 后的构建脚本环境。
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: indredK/bench
          ref: ${{ needs.baseline.outputs.sha }}
          path: bench
          persist-credentials: false

      - name: Resolve and validate plugin id (P12)
        # 不可信上下文（workflow_dispatch inputs / tag 名）只经 env 进入 shell，
        # 不做模板插值；插件 id 一律 allowlist 校验后才能参与后续步骤。
        env:
          INPUT_PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail
          plugin_id="${INPUT_PLUGIN_ID:-${GITHUB_REF_NAME%-v*}}"

          # tag 触发时必须严格匹配 <plugin-id>-v<semver>，防止 glob *-v* 误吞。
          # set -u 下 BASH_REMATCH[n] 可能整组未定义（unbound variable），
          # 所以匹配结果先落到显式局部变量。
          tag_prefix=""
          tag_version=""
          if [[ "${GITHUB_REF_TYPE:-branch}" == "tag" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ ^([a-z0-9][a-z0-9-]*)-v(([0-9]+)\.([0-9]+)\.([0-9]+))$ ]]; then
              echo "::error::tag '$GITHUB_REF_NAME' 不匹配 <plugin-id>-v<X.Y.Z>（严格 semver）"
              exit 1
            fi
            # set -u 下逐个引用 BASH_REMATCH[n] 会 unbound（未参与匹配的组），
            # 先整体拷贝再使用。版本号作为整体捕获（REMATCH[2] = X.Y.Z 全串）。
            rematch=("${BASH_REMATCH[@]}")
            tag_prefix="${rematch[1]}"
            tag_version="${rematch[2]}"
            # 严格 semver：每段不允许前导零（01.2.3 非法）。
            for seg in "${rematch[3]}" "${rematch[4]}" "${rematch[5]}"; do
              [[ "$seg" =~ ^(0|[1-9][0-9]*)$ ]] \
                || { echo "::error::tag '$GITHUB_REF_NAME' 版本段含前导零，非严格 semver"; exit 1; }
            done
            [[ "$tag_prefix" == "$plugin_id" ]] \
              || { echo "::error::tag 前缀 '$tag_prefix' 与解析出的插件 id '$plugin_id' 不一致"; exit 1; }
          fi

          [[ "$plugin_id" =~ ^[a-z0-9][a-z0-9-]*$ ]] || { echo "::error::非法插件 id: $plugin_id"; exit 1; }
          [[ -f "market/extensions/$plugin_id/manifest.json" ]] || { echo "::error::插件不存在: $plugin_id"; exit 1; }

          # tag 触发时，tag 版本必须与该插件 manifest.json version 相等。
          if [[ -n "$tag_version" ]]; then
            manifest_version="$(node -p "JSON.parse(require('fs').readFileSync('market/extensions/$plugin_id/manifest.json','utf8')).version")"
            [[ "$tag_version" == "$manifest_version" ]] \
              || { echo "::error::tag 版本 $tag_version != manifest 版本 $manifest_version"; exit 1; }
          fi

          echo "PLUGIN_ID=$plugin_id" >> "$GITHUB_ENV"


      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: market/.node-version
          cache: pnpm
          cache-dependency-path: |
            market/pnpm-lock.yaml
            bench/pnpm-lock.yaml

      - name: Install host dependencies
        working-directory: bench
        run: pnpm install --frozen-lockfile

      - name: Install market dependencies
        working-directory: market
        run: pnpm install --frozen-lockfile

      - name: Verify plugin exists
        run: test -f "market/extensions/$PLUGIN_ID/manifest.json"

      - name: Place plugin into host workspace
        run: |
          mkdir -p bench/extensions
          rm -rf "bench/extensions/$PLUGIN_ID"
          cp -R "market/extensions/$PLUGIN_ID" "bench/extensions/$PLUGIN_ID"

      - name: Audit i18n self-containment
        run: node market/scripts/audit-i18n.mjs --bench bench --plugin "$PLUGIN_ID"

      - name: Build & pack extension
        working-directory: bench
        run: node scripts/plugins/pack-extension.mjs "$PLUGIN_ID" --out "$GITHUB_WORKSPACE/dist"

      - name: Write provenance receipt
        env:
          HOST_SHA: ${{ needs.baseline.outputs.sha }}
          MARKET_SHA: ${{ github.sha }}
        run: |
          node market/scripts/write-provenance.mjs \
            --dist "$GITHUB_WORKSPACE/dist" \
            --market-sha "$MARKET_SHA" \
            --host-sha "$HOST_SHA" \
            --host-dir bench

      # release-please（release-please.yml）已创建带 changelog body 的 Release；
      # 此处仅追加 zip 资产。不开启 generate_release_notes，避免覆盖其 body。
      #
      # ⚠️ 不用 softprops/action-gh-release：Release 已存在时它走 PATCH
      # update-a-release，本仓库 GITHUB_TOKEN 无该权限（403 Resource not
      # accessible by integration）。改用 gh release upload（只传资产）。
      - name: Upload assets to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          # 仓库 checkout 在 market/ 子目录，$GITHUB_WORKSPACE 不是 git 仓库，
          # gh 必须用 --repo 显式指定（否则报 "not a git repository"）。
          repo="${GITHUB_REPOSITORY}"
          gh release view "$GITHUB_REF_NAME" --repo "$repo" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --repo "$repo" --title "${PLUGIN_ID} ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/provenance.json --repo "$repo" --clobber

      # workflow_dispatch（诊断用）在分支 ref 上运行，无法创建 Release，
      # 以 artifact 形式保留 zip 与来源收据以便下载验证。
      - name: Upload build artifact
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bench-ext-${{ env.PLUGIN_ID }}-zip
          path: |
            dist/*.zip
            dist/provenance.json
          retention-days: 14
          if-no-files-found: error

      # 市场索引自持（P5/P11）：zip 上传后把该版本 upsert 进 registry.json，
      # 但不再直推 main —— 改为 bot 分支 + PR，等 quality gate 绿色后合并。
      # 这样 registry 写回与其它进入 main 的路径一样经过同一质量闸门，
      # 无法借发布通道绕过分支保护（P11）。
      - name: Open registry update pull request
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME##*-v}"
          branch="bot/registry-${PLUGIN_ID}-v${version}"
          echo "Registry update: ${PLUGIN_ID}@${version} -> branch $branch"
          cd market
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 从 main 最新状态开工（tag 可能落后于 main，避免 PR 带回旧提交）。
          git fetch origin main --depth=1
          git checkout -B "$branch" origin/main
          node scripts/update-registry.mjs \
            --plugin "$PLUGIN_ID" \
            --version "$version" \
            --dist "$GITHUB_WORKSPACE/dist"
          git add registry.json
          if git diff --cached --quiet; then
            echo "registry.json unchanged"
            exit 0
          fi
          git commit -m "chore(registry): publish ${PLUGIN_ID} v${version}"
          # 幂等：同 tag 重跑时远程可能残留同名 bot 分支（上次 run 的 PR 已删
          # 或未合并）——先删再推，保证分支内容 = 本次快照。
          git push origin --delete "$branch" 2>/dev/null || true
          git push origin "$branch"
          # 已存在同名 PR 时复用（重跑场景），否则新建。
          existing_pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing_pr" ]; then
            echo "registry PR 已存在: #$existing_pr（复用）"
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --head "$branch" \
              --base main \
              --title "chore(registry): publish ${PLUGIN_ID} v${version}" \
              --body "自动 registry 写回（release.yml @ ${GITHUB_SHA}）。合并前必须通过 quality gate（P11：写回也走 PR）。"
          fi
