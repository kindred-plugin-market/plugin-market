name: quality

# 只读验证：i18n 必过链 + 七插件真实测试（宿主工具链）。
# 宿主 checkout 固定在 `.github/host-baseline.txt`（HOST_BASELINE_SHA），不跟随 main；
# 构建/发布读同一个文件（P09），三者输入一致才谈得上「测试结论可传递到产物」。
# 本工作流绝不提交/推送/发布（发布职责归 release-please，属业务流程）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

env:
  # 与 package.json 的 packageManager 一致；三个工作流共用同一个值（tests/build-inputs.test.mjs 锁定）。
  PNPM_VERSION: 12.4.1

jobs:
  quality:
    name: quality (node 26.8.2 / macos)
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（市场）
      - name: Resolve host baseline
        id: host
        run: echo "sha=$(cat .github/host-baseline.txt)" >> "$GITHUB_OUTPUT"
      - name: Checkout pinned host baseline
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1（宿主 indredK/bench）
        with:
          repository: indredK/bench
          ref: ${{ steps.host.outputs.sha }}
          path: host
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            host/pnpm-lock.yaml
      - name: Install host dependencies (frozen)
        run: pnpm install --frozen-lockfile
        working-directory: host
      - name: Install market dependencies (frozen)
        run: pnpm install --frozen-lockfile
      - name: i18n self-containment audit (7 plugins)
        run: pnpm run audit:ext-i18n
      # 宿主路径相对**工作区根**（= 本仓库根，host/ 由上面的 checkout 建立）；
      # `../host` 会落到 $GITHUB_WORKSPACE/../host，永远不存在（P07）。
      # scripts/quality/check-workflow-layout.mjs 静态锁定这个约定。
      - name: Static guards and tests
        run: pnpm test
      - name: i18n parity vs host baseline
        run: pnpm run check:i18n-parity -- --bench host
      - name: Extension tests (host toolchain)
        run: pnpm run test:extensions -- --host host
