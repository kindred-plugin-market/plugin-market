name: quality

# 只读验证入口：PR / main 推送 / 手动触发都跑同一条门禁。
# 门禁本体在 quality-gate.yml（唯一一份定义，build.yml 与 release.yml 也调用它），
# 宿主 checkout 固定在 `.github/host-baseline.txt`（HOST_BASELINE_SHA），不跟随 main。
# 本工作流绝不提交/推送/发布（发布职责归 release-please，属业务流程）。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 唯一的宿主 SHA 来源：从市场仓文件读出，交给门禁（以及构建/发布）使用。
  baseline:
    name: resolve host baseline
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.host.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read pinned host sha
        id: host
        run: echo "sha=$(cat .github/host-baseline.txt)" >> "$GITHUB_OUTPUT"

  gate:
    needs: baseline
    uses: ./.github/workflows/quality-gate.yml
    with:
      host-ref: ${{ needs.baseline.outputs.sha }}
