name: Release Please

# 参考 Bench 宿主仓库同款设计（manifest 多包模式，按插件独立发版）：
# main 收到 conventional commits（feat/fix 等且触及 extensions/<id>/）→
# 自动维护各插件 release PR（bump manifest.json 版本 + 生成 CHANGELOG.md）
# → 合并 PR 后自动打 <pluginId>-v<version> tag 并创建 GitHub Release
# → tag push 触发 release.yml 构建 zip 并上传到该 Release。
#
# token 说明：github.token 产生的 tag push 不会触发其他 workflow（GitHub
# 防递归机制），因此优先 PAT：RELEASE_PLEASE_TOKEN > BENCH_REPO_TOKEN >
# github.token（兜底时 tag 已创建但不自动发布，需手动 dispatch release.yml）。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run release-please
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.BENCH_REPO_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main
