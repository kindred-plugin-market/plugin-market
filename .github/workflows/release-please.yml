name: Release Please

# 参考 Bench 宿主仓库同款设计（manifest 多包模式，按插件独立发版）：
# main 收到 conventional commits（feat/fix 等且触及 extensions/<id>/）→
# 自动维护各插件 release PR（bump manifest.json 版本 + 生成 CHANGELOG.md）
# → 人工合并 PR 后自动打 <pluginId>-v<version> tag 并创建 GitHub Release
# → 由下方 Trigger 步骤接力触发 release.yml 构建上传 zip 资产。
#
# token 说明：组织策略禁止寿命 >366 天的 fine-grained PAT 访问本仓库 API，
# 故统一使用 github.token（可建 PR / 打 tag / 建 Release）。github.token 产生
# 的 tag push 不会触发其他 workflow（GitHub 防递归），但 workflow_dispatch
# 是官方明确例外 —— 因此用 `gh workflow run --ref <tag>` 逐插件接力发布。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 新增插件自动登记：extensions/ 下出现新目录即补进 config / manifest，
      # 使本次 release-please 就能识别（不必手改 release-please-config.json）。
      - name: Sync release-please config
        run: |
          set -euo pipefail
          node scripts/sync-release-please.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release-please-config.json .release-please-manifest.json
          if git diff --cached --quiet; then
            echo "release-please config in sync"
            exit 0
          fi
          git commit -m "chore: register plugins with release-please"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Run release-please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

      # 逐插件以 tag ref 触发 release.yml（workflow_dispatch 支持以 tag 为
      # ref，此时其内部 github.ref = refs/tags/<tag>，tag 匹配、插件 id 解析
      # 与 Release 上传步骤均按既有逻辑工作）。plugin_id 必须显式传入，
      # 否则会被 release.yml 的 input default（hardware）填充而构建错插件。
      - name: Trigger release workflow for each released tag
        if: steps.rp.outputs.releases_created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RP_OUTPUTS: ${{ toJSON(steps.rp.outputs) }}
        run: |
          set -euo pipefail
          # 动态遍历 release-please 输出的所有 <package>--tag_name：
          # 新增插件无需改本文件（包清单由 sync-release-please.mjs 维护）。
          tags=$(echo "$RP_OUTPUTS" | jq -r 'to_entries | map(select((.key | endswith("--tag_name")) and .value != null and .value != "")) | .[].value')
          [ -n "$tags" ] || { echo "no tag resolved from release-please outputs"; exit 1; }
          for tag in $tags; do
            plugin_id="${tag%-v*}"
            echo "Dispatching release build for $tag (plugin: $plugin_id)"
            gh workflow run release.yml --ref "$tag" -f "plugin_id=$plugin_id"
          done
